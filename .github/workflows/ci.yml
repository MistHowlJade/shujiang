name: 回归测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 单元测试（lib，635 项）
        run: npm test

      # 假模型 + 隔离服务 + 回归跑在同一个 step 里——子进程只活得过本 step，拆开就都没了
      # 数据写到临时目录，绝不碰任何真实 data/
      - name: 回归自检（288 项）
        shell: pwsh
        run: |
          $env:SHU_DATA_DIR = Join-Path $env:RUNNER_TEMP 'shujiang-ci'
          $mock = Start-Process node -ArgumentList 'dev/mock-openai.js' -NoNewWindow -PassThru
          $svr  = Start-Process node -ArgumentList 'server/server.js' -NoNewWindow -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $tcp = [System.Net.Sockets.TcpClient]::new()
              $iar = $tcp.BeginConnect('127.0.0.1', 8848, $null, $null)
              if ($iar.AsyncWaitHandle.WaitOne(1500) -and $tcp.Connected) { $tcp.EndConnect($iar); $ok = $true; $tcp.Close(); break }
              $tcp.Close()
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw '服务启动 90 秒内 8848 端口没有就绪' }
          Write-Host '端口 8848 已就绪'
          node dev/regress.mjs
          $code = $LASTEXITCODE
          Stop-Process -Id $mock.Id, $svr.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }
